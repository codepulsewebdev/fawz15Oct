<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Reset Password | FAWZ</title><link rel="stylesheet" href="fawz-site.css">
<style>body{font:16px Arial;background:#f5f3ef;color:#171717}.box{max-width:440px;margin:10vh auto;background:white;padding:35px;border-radius:16px;box-shadow:0 18px 55px #0002;border-top:7px solid #e31e24}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{background:#e31e24;color:#fff;border:0;font-weight:bold;cursor:pointer}.status{min-height:24px;font-weight:700;color:#9d0910}</style>
</head>
<body><main class="box"><h1>Password reset</h1><p>Enter the email address of an approved FAWZ account.</p><form id="form"><input name="email" type="email" autocomplete="email" placeholder="Approved email" required><button>Send reset instructions</button></form><p class="status" id="status" role="status"></p><a href="login.html">Back to login</a></main>
<script>
document.getElementById('form').addEventListener('submit',async function(event){event.preventDefault();const status=document.getElementById('status');status.textContent='Sending…';try{const response=await fetch('/api/request-reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:this.email.value})});const data=await response.json();if(!response.ok)throw Error(data.error);status.textContent=data.message}catch(error){status.textContent=error.message}})
</script><script src="fawz-content-protection.js"></script></body></html>
