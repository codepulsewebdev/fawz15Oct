<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Set Password | FAWZ</title><link rel="stylesheet" href="fawz-site.css"><style>body{margin:0;background:#f5f3ef;font-family:Arial;color:#171717}.box{width:min(440px,calc(100% - 40px));margin:10vh auto;background:#fff;padding:38px;border-radius:18px;box-shadow:0 18px 55px #0002;border-top:7px solid #e31e24}h1{margin-top:0}label{display:block;font-weight:800;margin:18px 0 7px}input,button{box-sizing:border-box;width:100%;padding:15px;border-radius:9px;border:1px solid #ccc;font-size:16px}button{margin-top:22px;background:#e31e24;color:white;border:0;font-weight:900;cursor:pointer}.status{min-height:22px;color:#9d0910;margin-top:14px}</style></head><body><main class="box"><h1>Secure your account</h1><p>Replace the temporary password before viewing customer pricing.</p><form id="change"><label>Current password</label><input name="current" type="password" autocomplete="current-password" required><label>New password</label><input name="next" type="password" minlength="12" autocomplete="new-password" required><label>Repeat new password</label><input name="repeat" type="password" minlength="12" autocomplete="new-password" required><button>Save new password</button><div class="status" id="status"></div></form></main><script src="fawz-site.js"></script><script src="fawz-secure-pricing.js"></script><script src="fawz-inactivity.js"></script><script>document.getElementById('change').addEventListener('submit',async function(e){e.preventDefault();const s=document.getElementById('status');if(this.next.value!==this.repeat.value){s.textContent='The new passwords do not match.';return}try{const r=await fetch('/api/change-password',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-csrf-token':sessionStorage.getItem('fawz_csrf')||''},body:JSON.stringify({currentPassword:this.current.value,newPassword:this.next.value})});const x=await r.json();if(!r.ok)throw Error(x.error);location.href='login.html'}catch(err){s.textContent=err.message}})</script><script src="fawz-content-protection.js"></script></body></html>
