<style>
:root{--fawz-red:#e31e24;--fawz-dark:#1a1a1a;--fawz-grey:#f8f8f8;--border:#eeeeee;}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#fff;color:var(--fawz-dark);-webkit-user-select:none;user-select:none}
header{position:sticky;top:0;background:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--fawz-red);box-shadow:0 2px 10px rgba(0,0,0,.05);z-index:1000;gap:20px;flex-wrap:wrap}
.logo{font-weight:900;text-transform:uppercase;letter-spacing:1px;font-size:1.2rem}
.logo span{color:var(--fawz-red)}
nav{display:flex;gap:16px;flex-wrap:wrap}
nav a{color:var(--fawz-dark);text-decoration:none;font-weight:700;font-size:.9rem}
.hero{padding:46px 5% 24px;max-width:1300px;margin:auto}
.hero h1{font-size:clamp(2rem,4vw,3.5rem);margin:0;text-transform:uppercase}
.hero p{color:#666;max-width:900px;line-height:1.6;margin-top:10px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.toolbar input{padding:13px 14px;border:1px solid #ddd;border-radius:10px;min-width:280px;font-size:1rem;background:#fff}
main{padding:15px 5% 70px;max-width:1300px;margin:auto}
.category-main-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:25px;margin-top:20px;}
.category-main-card{background:#fff;border:2px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.05);transition:.3s ease;text-align:center;}
.category-main-card:hover{transform:translateY(-5px);border-color:var(--fawz-red);box-shadow:0 18px 36px rgba(0,0,0,.12)}
.category-main-card .img-wrap{height:200px;background:#fcfcfc;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);padding:20px}
.category-main-card img{max-width:100%;max-height:100%;object-fit:contain}
.category-main-card h3{margin:18px 0 18px;font-size:1.1rem;text-transform:uppercase;color:var(--fawz-dark)}

.modal{display:none;position:fixed;z-index:2000;inset:0;background:rgba(0,0,0,.65);padding:30px 12px;overflow-y:auto}
.close-x{position:absolute;right:22px;top:16px;font-size:32px;cursor:pointer;color:#999;z-index:10;line-height:1}
.close-x:hover{color:var(--fawz-red)}
.category-modal-content{background:#fff;margin:auto;max-width:1100px;border-radius:20px;padding:35px 25px 40px;position:relative;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.category-modal-header{margin-bottom:25px;border-left:6px solid var(--fawz-red);padding-left:15px}
.category-modal-header h2{margin:0;font-size:1.8rem;text-transform:uppercase}
.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;max-height:70vh;overflow-y:auto;padding-right:5px}
.sub-product-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.04);transition:.2s ease}
.sub-product-card:hover{transform:translateY(-3px);border-color:var(--fawz-red);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.sub-product-img{height:150px;background:#fafafa;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);padding:12px}
.sub-product-img img{width:100%;height:100%;object-fit:contain}
.sub-product-info{padding:12px;text-align:center}
.sub-product-info h4{font-size:0.9rem;margin:0;line-height:1.25}

.modal-content{background:#fff;margin:auto;max-width:980px;min-height:500px;display:grid;grid-template-columns:1fr 1.05fr;border-radius:18px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.24);position:relative}
.modal-left{background:#fafafa;display:flex;align-items:center;justify-content:center;padding:28px;border-right:1px solid var(--border);position:relative}
.modal-left img{width:100%;height:100%;max-height:430px;object-fit:contain}
.modal-left .no-image-icon{font-size:4rem;color:#ccc}
.modal-right{padding:42px 36px;overflow-y:auto;max-height:88vh}
.modal-right h2{margin:0 0 12px;text-transform:uppercase;color:var(--fawz-red)}
.modal-meta{color:#666;font-size:.92rem;word-break:break-all;line-height:1.6}
label{display:block;margin:18px 0 8px;font-weight:900;text-transform:uppercase;font-size:.75rem;color:#555}
input,.option-select{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:1rem;background:var(--fawz-grey)}
.btn-add{width:100%;background:var(--fawz-red);border:none;color:#fff;font-weight:900;text-transform:uppercase;padding:17px;border-radius:12px;cursor:pointer;letter-spacing:1px;margin-top:20px}
.btn-add:hover{background:#b3161a}
.hidden{display:none!important}
#imageBank{display:none}

@media(max-width:760px){
  header{align-items:flex-start;flex-direction:column} 
  nav a{margin:0 14px 0 0}
  .category-main-grid{grid-template-columns:1fr 1fr;gap:12px}

  .modal-left{min-height:200px;border-right:0;border-bottom:1px solid var(--border)}
  .category-grid{grid-template-columns:repeat(2,1fr)}
}
@media print{body{display:none!important}}

// The project folder is named "interlinning" (double n).
// Keep every existing product filename intact while pointing it at the real folder.
Object.values(productGroups).forEach(group => {
  group.img = group.img.replace('images/interlining/', 'images/interlinning/');
  if (group.options) {
    group.options.forEach(option => {
      option.img = option.img.replace('images/interlining/', 'images/interlinning/');
    });
  }
});

// ==================== SCRIPT LOGIC ====================
let currentGroup = null;
let selectedProduct = null;

function getBankImage(key){
  const img = document.querySelector(`#imageBank img[data-img-key="${CSS.escape(key)}"]`);
  return img ? img.getAttribute('src') : '';
}

function tryImageExtension(img) {
  const extensions = ['jpg', 'jpeg', 'png', 'webp'];
  const base = img.dataset.imageBase || img.src.replace(/\.(jpg|jpeg|png|webp)$/i, '');
  const nextIndex = Number(img.dataset.extensionIndex || 0) + 1;
  img.dataset.imageBase = base;
  if (nextIndex < extensions.length) {
    img.dataset.extensionIndex = nextIndex;
    img.src = `${base}.${extensions[nextIndex]}`;
  } else {
    img.style.display = 'none';
  }
}

function buildCategoryCards() {
  const container = document.getElementById('categoryGrid');
  container.innerHTML = '';
  
  const cat = categoryData["interlining"];
  const card = document.createElement('div');
  card.className = 'category-main-card';
  card.onclick = () => openCategoryModal('interlining');
  
  const firstGroup = productGroups[cat.groups[0]];
  const imgSrc = firstGroup ? firstGroup.img : 'images/interlining/STFInterlining.jpg';
  
  card.innerHTML = `
    <div class="img-wrap">
      <img src="${imgSrc}" alt="${cat.title}" onerror="tryImageExtension(this)">
    </div>
    <h3>${cat.title}</h3>
  `;
  container.appendChild(card);
}

function openCategoryModal(catKey) {
  const cat = categoryData[catKey];
  if (!cat) return;

  document.getElementById('catModalTitle').textContent = cat.title;
  const container = document.getElementById('categoryGridContainer');
  container.innerHTML = '';

  cat.groups.forEach(groupId => {
    const group = productGroups[groupId];
    if (!group) return;

    const subCard = document.createElement('div');
    subCard.className = 'sub-product-card';
    subCard.onclick = () => openProductModal(groupId);
    
    subCard.innerHTML = `
      <div class="sub-product-img">
        <img src="${group.img}" alt="${group.title}" onerror="tryImageExtension(this)">
      </div>
      <div class="sub-product-info">
        <h4>${group.title}</h4>
      </div>
    `;
    container.appendChild(subCard);
  });

  document.getElementById('categoryGridModal').style.display = 'block';
}

function closeCategoryModal() {
  document.getElementById('categoryGridModal').style.display = 'none';
}

function openProductModal(groupId) {
  closeCategoryModal();
  currentGroup = productGroups[groupId];
  if (!currentGroup) return;

  document.getElementById('modalTitle').textContent = currentGroup.title;
  document.getElementById('modalMeta').textContent = `Category: ${currentGroup.category}`;
  
  // Reset all option wrappers
  ['rollWrap','itemWrap','colourWrap','widthWrap','gsmWrap','typeWrap','optionWrap','yardWrap'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  
  // Reset image - hide it until we have a valid src
  const modalImg = document.getElementById('modalImg');
  const modalLeft = document.getElementById('modalLeft');
  // Remove any existing no-image icon
  const existingIcon = modalLeft.querySelector('.no-image-icon');
  if (existingIcon) existingIcon.remove();
  modalImg.style.display = 'none';
  
  const select = document.getElementById('optionSelect');
  select.innerHTML = '';
  
  if (currentGroup.type === 'nonwoven') {
    document.getElementById('rollWrap').classList.remove('hidden');
    document.getElementById('itemWrap').classList.remove('hidden');
    
    const rollSelect = document.getElementById('rollSelect');
    rollSelect.innerHTML = currentGroup.rollLengths.map(r => `<option value="${r}">${r}</option>`).join('');
    
    document.getElementById('colourWrap').classList.remove('hidden');
    const colourSelect = document.getElementById('colourSelect');
    colourSelect.innerHTML = `<option value="White">White</option><option value="Black">Black</option>`;
    updateNonWovenItems();
    
    document.getElementById('itemSelect').onchange = updateVariant;
    document.getElementById('rollSelect').onchange = updateNonWovenItems;
    document.getElementById('colourSelect').onchange = updateNonWovenItems;
    
    updateVariant();
  } else {
    if (currentGroup.options && currentGroup.options.length > 0) {
      document.getElementById('optionWrap').classList.remove('hidden');
      const optionSelect = document.getElementById('optionSelect');
      optionSelect.innerHTML = currentGroup.options.map((opt, idx) => 
        `<option value="${idx}">${opt.name}</option>`
      ).join('');
      optionSelect.onchange = updateVariant;
      updateVariant();
    } else {
      document.getElementById('optionWrap').classList.remove('hidden');
      document.getElementById('optionSelect').innerHTML = `<option value="0">Standard</option>`;
      updateVariant();
    }
  }

  document.getElementById('productModal').style.display = 'block';
}

function updateNonWovenItems() {
  const roll = document.getElementById('rollSelect').value;
  const colour = document.getElementById('colourSelect').value;
  const items = currentGroup.variants[roll][colour];
  document.getElementById('itemSelect').innerHTML = items.map(i => `<option value="${i}">${i}</option>`).join('');
  updateVariant();
}

function updateVariant() {
  if (!currentGroup) return;
  
  let name = currentGroup.title;
  let img = currentGroup.img;
  let productId = '';
  let size = '';
  let color = '';
  
  if (currentGroup.type === 'nonwoven') {
    const roll = document.getElementById('rollSelect').value;
    const item = document.getElementById('itemSelect').value;
    const colour = document.getElementById('colourSelect').value;
    name = `${currentGroup.title} - ${item} · ${roll} · ${colour}`;
    productId = `nonwoven-${item}-${roll}-${colour}`.toLowerCase().replace(/\s/g,'-').replace(/[^a-z0-9-]/g,'');
    size = `${item} · ${roll}`;
    color = colour;
    const folder = `Perlon ${colour} - ${roll.startsWith('25') ? '25 Yards' : '100y'}`;
    img = `images/interlinning/${folder}/${item}.jpg`;
  } else {
    const optionSelect = document.getElementById('optionSelect');
    const idx = parseInt(optionSelect.value);
    const opt = currentGroup.options[idx];
    if (opt) {
      name = opt.name;
      productId = opt.productId;
      size = opt.size || '';
      color = opt.color || '';
      img = opt.img || currentGroup.img;
    }
  }
  
  selectedProduct = {
    name: name,
    productId: productId,
    size: size,
    color: color,
    img: img,
    category: currentGroup.category
  };
  window.fawzCurrentProductId = selectedProduct.productId;
  
  // Handle image display properly - no flashing
  const modalImg = document.getElementById('modalImg');
  const modalLeft = document.getElementById('modalLeft');
  const existingIcon = modalLeft.querySelector('.no-image-icon');
  if (existingIcon) existingIcon.remove();
  
  // Load the matching file, including projects where Windows hid a non-JPG extension.
  const extensions = ['jpg', 'jpeg', 'png', 'webp'];
  const base = img.replace(/\.(jpg|jpeg|png|webp)$/i, '');
  let extensionIndex = 0;
  const loadSelectedImage = () => {
    const candidate = `${base}.${extensions[extensionIndex]}`;
    const imgTest = new Image();
    imgTest.onload = function() {
      modalImg.src = candidate;
      modalImg.style.display = 'block';
      selectedProduct.img = candidate;
    };
    imgTest.onerror = function() {
      extensionIndex += 1;
      if (extensionIndex < extensions.length) {
        loadSelectedImage();
      } else {
        modalImg.style.display = 'none';
        if (!modalLeft.querySelector('.no-image-icon')) {
          const icon = document.createElement('div');
          icon.className = 'no-image-icon';
          icon.textContent = '📄';
          modalLeft.appendChild(icon);
        }
      }
    };
    imgTest.src = candidate;
  };
  loadSelectedImage();
}

function closeProductModal() {
  document.getElementById('productModal').style.display = 'none';
}

function addToCart() {
  if (!selectedProduct) {
    alert("Please select a product first.");
    return;
  }
  
  const qty = parseInt(document.getElementById('qtyInput').value) || 1;

  const cart = JSON.parse(window.FawzCart.getItem('cart') || '[]');
  cart.push({
    name: selectedProduct.name,
    productId: selectedProduct.productId,
    category: selectedProduct.category,
    size: selectedProduct.size,
    color: selectedProduct.color,
    qty: qty,
    image: selectedProduct.img
  });
  
  window.FawzCart.setItem('cart', JSON.stringify(cart));
  
  window.FawzCartNotice.show(`Added ${qty} x ${selectedProduct.name} to your cart successfully!`);
  closeProductModal();
}

function filterProducts() {
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  document.querySelectorAll('.category-main-card').forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = (!q || text.includes(q)) ? 'flex' : 'none';
  });
}

document.getElementById('searchBox').addEventListener('input', filterProducts);

window.addEventListener('click', e => { 
  if(e.target === document.getElementById('categoryGridModal')) closeCategoryModal();
  if(e.target === document.getElementById('productModal')) closeProductModal(); 
});

document.addEventListener('DOMContentLoaded', function() {
  buildCategoryCards();
});
